<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Default profile picture">
  <defs>
    <linearGradient id="avatar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF1DE"/>
      <stop offset="1" stop-color="#F7DCC9"/>
    </linearGradient>
    <clipPath id="avatar-clip">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-clip)">
    <rect width="64" height="64" fill="url(#avatar-bg)"/>
    <circle cx="32" cy="25" r="11" fill="#D97B4A" fill-opacity="0.85"/>
    <ellipse cx="32" cy="61" rx="21" ry="18" fill="#D97B4A" fill-opacity="0.85"/>
  </g>
</svg>
